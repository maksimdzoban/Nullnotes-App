name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps --no-audit
      - name: Build web dist
        run: npx vite build
      - name: Add & Sync Capacitor Android
        run: npx cap add android || true && npx cap sync android
      - name: Configure Android Signing and Keystore
        run: node scripts/configure-android-signing.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          APP_VERSION: '0.3.0'
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nullnotes-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
